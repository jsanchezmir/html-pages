<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared HTML Pages</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f5f7fb;
      color: #172033;
      font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(640px, calc(100% - 40px));
      padding: 40px;
      border: 1px solid #dbe2ef;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(23, 32, 51, .12);
    }
    h1 { margin-top: 0; font-size: 34px; }
    p { color: #53617a; }
    @media (prefers-color-scheme: dark) {
      body { background: #101522; color: #edf2ff; }
      main { border-color: #2b3852; background: #182238; box-shadow: none; }
      p { color: #b7c3d9; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Shared HTML Pages</h1>
    <p>This repository is a lightweight publishing pipeline for quickly sharing standalone HTML pages through GitHub Pages.</p>
    <p>Published documents live under their own route and can be replaced or added without coupling the repository to a specific implementation.</p>
  </main>
</body>
</html>
